name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner and check source and history
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/slithy-scanner
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/slithy-scanner
          python3 tools/scan-source.py --gitleaks /tmp/slithy-scanner/gitleaks
          python3 tools/scan-source.py --gitleaks /tmp/slithy-scanner/gitleaks --history
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 libevent-dev libboost-dev libsqlite3-dev g++-mingw-w64-x86-64-posix make automake libtool bsdextrautils curl zip unzip patch
      - name: Build native tools from source
        run: bash tools/build-core.sh ${{ matrix.target }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: matrix.target == 'linux'
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone Linux recovery helper
        if: matrix.target == 'linux'
        run: dotnet publish tools/SlithySeedTool/SlithySeedTool.csproj -c Release -r linux-x64 --self-contained true -o build/seed/linux
      - name: Slithy native and shell checks
        if: matrix.target == 'linux'
        run: |
          ctest --test-dir build/native/linux --output-on-failure -R '^pow_tests$'
          python3 -m unittest discover -s tests/security -p 'test_*.py'
          python3 tests/terms/linux-terms-test.py
          mkdir -p build/integration
          python3 tests/security/core-mining-integration.py --bin build/native/linux/bin --core-source core --work build/integration --seed-tool build/seed/linux/SlithySeedTool --linux-menu site/install/linux/slithy --status-server services/slithy-node-status-server.py
          SLITHY_SEED_TOOL="$PWD/build/seed/linux/SlithySeedTool" bash tools/build-linux-release-tarball.sh "$PWD/build/native/linux/bin" 0.1.48-testnet "$PWD/build/packages"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.target == 'windows'
        with:
          name: windows-native-unsigned
          path: |
            build/native/windows/bin/slithyd.exe
            build/native/windows/bin/slithy-cli.exe
            build/native/windows/bin/slithy-wallet.exe
            build/native/windows/bin/slithy-tx.exe
          if-no-files-found: error
  windows-app:
    needs: native
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-native-unsigned
          path: build/native/windows/bin
      - name: Build and test Windows source
        shell: pwsh
        run: |
          dotnet build 'Desktop/Slithy Tove/Slithy Tove.sln' -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/security/Slithy.SecurityTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/terms/TermsTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
